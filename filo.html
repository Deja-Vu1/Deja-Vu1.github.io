<link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="canonical" href="https://deja-vu1.github.io/filo.html"></head><body>
<div id="site-header"></div>
<main>
<div class="page-head"><div class="wrap"><h1 data-tr="Teknik kabiliyetler ve filomuz" data-en="Technical capabilities and fleet">Teknik kabiliyetler ve filomuz</h1></div></div>
<section><div class="wrap">
 <div class="tabs" role="tablist" id="tabs"></div>
 <div class="spec">
  <figure><img id="f-img" alt="" onerror="this.style.display='none'"></figure>
  <div><h2 id="f-name"></h2><p class="muted" id="f-desc"></p><div id="f-bars"></div></div>
 </div>
</div></section></main>
<div id="site-footer"></div>
<script src="main.js"></script>
<script>
/* TODO: değerleri ve görsel adlarını kendi verilerinle değiştir */
const FLEET=[
 {img:'filo_2025.jpg',tr:'2025 Teknofest İHA',en:'2025 Teknofest UAV',dtr:'Stabilite ve yük bırakma hassasiyeti ile kendini kanıtlamış, operasyonel kabiliyeti yüksek kıdemli platformumuz.',den:'Our senior platform, proven by its stability and payload-drop precision, with high operational capability.',v:[75,65,70,60]},
 {img:'filo_uydu.jpg',tr:'Model Uydu',en:'Model Satellite',dtr:'Mühendislik disipliniyle geliştirilen; telemetri veri iletimi, atmosferik analiz ve faydalı yük mekanizmalarını bünyesinde barındıran CubeSat prototipi.',den:'A CubeSat prototype developed with engineering discipline, featuring telemetry data transmission, atmospheric analysis and payload mechanisms.',v:[15,10,95,90]}];
const BARS=[['Hız','Speed'],['Manevra','Agility'],['Menzil','Range'],['Uçuş Süresi','Endurance']];
let cur=0;
function render(){const l=getLang(),f=FLEET[cur];
 document.getElementById('tabs').innerHTML=FLEET.map((x,i)=>`<button role="tab" aria-selected="${i===cur}" data-i="${i}">${x[l]}</button>`).join('');
 document.getElementById('f-name').textContent=f[l];
 document.getElementById('f-desc').textContent=f['d'+l];
 const im=document.getElementById('f-img');im.style.display='';im.src=f.img;
 document.getElementById('f-bars').innerHTML=BARS.map((b,i)=>`<div class="bar-row"><div><span>${b[l==='tr'?0:1]}</span><span>${f.v[i]}%</span></div><div class="track"><div class="fillbar" style="width:${f.v[i]}%"></div></div></div>`).join('');}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(b){cur=+b.dataset.i;render()}};
document.addEventListener('langchange',render);render();
</script>
</body></html>
